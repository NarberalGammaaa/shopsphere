# One command to run everything:  docker compose up --build
# Defaults below work out of the box; override any of them in a .env file (see .env.example).
services:
  mysql:
    image: mysql:8.4
    container_name: shopsphere-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shopsphere}
      MYSQL_USER: ${MYSQL_USER:-shop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shop_pass}
    ports:
      - "${MYSQL_PORT:-3307}:3306"   # host 3307 avoids clashing with a MySQL already on 3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build: ./backend
    container_name: shopsphere-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-shopsphere}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-shop}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-shop_pass}
      JWT_SECRET: ${JWT_SECRET:-pvVx3ADeAs6wQgZhSqFzcfpjTBc9x+qNIbOR9T1P2Pucw78PvUVbT0b43yeSUi16}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
      # Optional features: leave empty to keep them switched off
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-claude-haiku-5-5}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: shopsphere-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  mysql_data:
