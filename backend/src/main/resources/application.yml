server:
  port: 8080

spring:
  application:
    name: shopsphere
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shopsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    username: "${SPRING_DATASOURCE_USERNAME:shop}"
    password: "${SPRING_DATASOURCE_PASSWORD:shop_pass}"
  jpa:
    open-in-view: false
    hibernate:
      # "update" keeps setup friction-free. For production switch to "validate" and manage schema with Flyway.
      ddl-auto: update

app:
  jwt:
    # Base64 string, at least 32 bytes decoded. Override JWT_SECRET in every real environment.
    secret: "${JWT_SECRET:pvVx3ADeAs6wQgZhSqFzcfpjTBc9x+qNIbOR9T1P2Pucw78PvUVbT0b43yeSUi16}"
    expiration-ms: "${JWT_EXPIRATION_MS:86400000}"
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}"
  seed:
    admin-email: "${ADMIN_EMAIL:admin@shopsphere.com}"
    admin-password: "${ADMIN_PASSWORD:Admin@123}"
    demo-email: "user@shopsphere.com"
    demo-password: "User@1234"

management:
  endpoints:
    web:
      exposure:
        include: health,info
